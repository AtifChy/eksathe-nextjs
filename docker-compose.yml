services:
  db:
    image: postgres:17-alpine
    container_name: eksathe-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eksathe
      POSTGRES_PASSWORD: eksathe_dev_password
      POSTGRES_DB: eksathe
      TZ: Asia/Dhaka
    ports:
      - "5432:5432"
    volumes:
      - eksathe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eksathe -d eksathe"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  eksathe_pgdata:
